  /* ---------- 基础工具 ---------- */

  function preset(name) {
    var p = window.AINDLE_PRESET;
    if (!p) return "";
    var v = p[name];
    if (v == null || v === "") return "";
    return String(v);
  }

  function qs(name) {
    var s = window.location.search || "";
    if (s.charAt(0) === "?") s = s.substring(1);
    var parts = s.split("&");
    var i;
    for (i = 0; i < parts.length; i++) {
      var kv = parts[i].split("=");
      if (decodeURIComponent(kv[0] || "") === name) return decodeURIComponent(kv[1] || "");
    }
    return preset(name);
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function vp() {
    var w = window.innerWidth, h = window.innerHeight;
    if ((!w || !h) && document.documentElement) {
      w = w || document.documentElement.clientWidth;
      h = h || document.documentElement.clientHeight;
    }
    if ((!w || !h) && document.body) {
      w = w || document.body.clientWidth;
      h = h || document.body.clientHeight;
    }
    if ((!w || !h) && window.screen) {
      w = w || screen.width;
      h = h || screen.height;
    }
    if (!w || !h) { w = BASE_W; h = 1448; }
    return { w: w, h: h };
  }

  function einkUa() {
    return navigator.userAgent || "";
  }

  function isEink() {
    var ua = einkUa();
    if (/Scribe/i.test(ua)) return true;
    // Scribe 5.16+：`Kindle Build/1.0` + Silk，不是旧的 `Kindle/3.0`。
    if (/Kindle Build/i.test(ua)) return true;
    return /Kindle\//.test(ua) && !/Silk/.test(ua);
  }

  function cssLong() {
    var sw = (window.screen && screen.width) || 0;
    var sh = (window.screen && screen.height) || 0;
    var v = vp();
    return Math.max(sw, sh, v.w, v.h);
  }

  function rawScreenLong() {
    var sw = (window.screen && screen.width) || 0;
    var sh = (window.screen && screen.height) || 0;
    return Math.max(sw, sh);
  }

  function isKindleUi() {
    if (qs("kindle") === "1") return true;
    if (qs("device") === "oasis1") return true;
    if (isScribe()) return true;
    return isEink();
  }

  function isScribe() {
    if (qs("device") === "scribe") return true;
    var ua = einkUa();
    if (/Scribe/i.test(ua)) return true;
    if (isScribeCssCanvas(ua)) return true;
    // 旧实验浏览器有时直接报 1860×2480，UA 只有 Kindle/3，没有 Scribe / Silk。
    return isEink() && rawScreenLong() >= 1800;
  }

  function isScribeCssCanvas(ua) {
    ua = ua || einkUa();
    if (cssLong() < 900) return false;
    if (/Kindle Build/i.test(ua)) return true;
    return /Silk/i.test(ua) && /Kindle/i.test(ua);
  }

  function isWideBoard() {
    if (isScribe()) return true;
    if (vp().w >= 1000) return true;
    return isEink() && rawScreenLong() >= 1800;
  }

  function liveNow() {
    return (MOCK && MOCK.now) || [];
  }

  function wantSplitBoard() {
    return isWideBoard();
  }

  function canvasLabel() {
    var dev = DEVICES[qs("device")];
    if (isScribe()) return "Scribe · 1860×2480";
    if (dev && dev.h) return dev.name + " · " + dev.w + "×" + dev.h;
    if (dev) return dev.name + " · " + dev.w;
    var v = vp();
    return v.w + "×" + v.h;
  }

  function computeScale() {
    var s = 1;
    var dev = DEVICES[qs("device")];
    if (dev) s = dev.w / BASE_W;
    else if (isEink()) s = vp().w / BASE_W;
    if (s < 0.72) s = 0.72;
    if (s > 1.85) s = 1.85;
    // Scribe 画布很宽：1.5 让账本有「一臂距离」的字号，溢出由 fitScribeCanvas 兜底收缩。
    if (isScribe() && s > 1.5) s = 1.5;
    var o = parseFloat(qs("scale") || "0");
    if (o >= 0.4 && o <= 3) s = o;
    S = s;
  }

  function px(n) { var v = Math.round(n * S); return v < 1 ? 1 : v; }
  // 固定宽度列（窗口条的 key/pct/reset、卡片右栏）不能随 S 等比放大，
  // 否则在 Scribe 等大画板预设下会把中间的进度条挤没。
  function LP(n) { var s = S > 1.25 ? 1.25 : S; var v = Math.round(n * s); return v < 1 ? 1 : v; }
  function F(n) { return "font-size:" + px(n) + "px;"; }
  function SP(n) { return '<div style="height:' + px(n) + 'px;font-size:1px;line-height:1px;">&nbsp;</div>'; }

  function isBigCanvas() {
    if (isScribe()) return true;
    var dev = DEVICES[qs("device")];
    if (dev && dev.big) return true;
    var v = vp();
    return Math.max(v.w, v.h) >= 1700 && Math.min(v.w, v.h) >= 1000;
  }

  function wantPanels() {
    var mode = forced || qs("mode");
    if (mode === "full") return false;
    if (mode === "panels") return true;
    if (isScribe()) return false;
    if (isBigCanvas()) return false;
    // Kindle 档（含真机 Oasis 浏览器）优先小屏账本：整页卡片看板在 e-ink 上不如账本。
    if (qs("kindle") === "1") return true;
    var dev = DEVICES[qs("device")];
    if (dev) return !dev.big;
    var v = vp();
    if (isEink()) {
      return !(Math.max(v.w, v.h) >= 1700 && Math.min(v.w, v.h) >= 1000);
    }
    if (isWideBoard()) return false;
    return Math.min(v.w, v.h) < 720;
  }

  function diag() {
    if (qs("debug") !== "1") return "";
    var v = vp();
    var dev = DEVICES[qs("device")];
    var sw = (window.screen && screen.width) || 0;
    var sh = (window.screen && screen.height) || 0;
    var guess = dev ? dev.name + "(预设)" : (isScribe() ? "Scribe" : (isEink() ? "Kindle e-ink" : "桌面/其它"));
    return '<br><span style="' + F(11) + '">debug · 视口 ' + v.w + "x" + v.h +
      " · 屏 " + sw + "x" + sh +
      " · dpr " + (window.devicePixelRatio || 1) +
      " · wide=" + (isWideBoard() ? "1" : "0") +
      " · split=" + (wantSplitBoard() ? "1" : "0") +
      " · 内容宽 " + (document.body ? document.body.scrollWidth : "?") +
      " · 缩放 x" + (Math.round(S * 100) / 100) + " · " + esc(guess) +
      " · " + esc(navigator.userAgent || "?") + "</span>";
  }

  /* ---------- 状态同步到 hash（整页刷新后回到原处） ---------- */

  function hashRead() {
    var s = String(window.location.hash || "");

    var out = {};

    for (i = 0; i < parts.length; i++) {
      var kv = parts[i].split("=");
      if (kv[0]) out[kv[0]] = kv[1] || "";
    }
    return out;
  }

  function hashWrite() {
    try {
      if (isKindleUi()) return;
      var h = "#view=" + currentView + "&scope=" + currentScope +
        (forced ? "&mode=" + forced : "");
      if (String(window.location.hash || "") !== h) window.location.hash = h;
    } catch (e) { /* 老浏览器忽略 */ }
  }

  /* ---------- 数据整形 ---------- */

  function moneyText(n) {
    n = Number(n);
    if (!isFinite(n)) return "—";
    if (n >= 1000) return "$" + Math.round(n);
    if (n >= 10) return "$" + n.toFixed(1);
    return "$" + n.toFixed(2);
  }

  function shortDate(iso) {
    if (!iso) return "—";
    var p = String(iso).split("-");
    if (p.length >= 3) return Number(p[1]) + "/" + Number(p[2].substring(0, 2));
    return iso;
  }

  function shortTime(iso) {
    var d = Date.parse(iso);
    if (!isFinite(d)) return String(iso || "—");
    var x = new Date(d);
    var hh = String(x.getHours());
    var mm = String(x.getMinutes());
    if (hh.length < 2) hh = "0" + hh;
    if (mm.length < 2) mm = "0" + mm;
    return hh + ":" + mm;
  }

  function laneCount(source, scope) {
    if (!MOCK || !MOCK.subs) return 0;
    var n = 0, i;
    for (i = 0; i < MOCK.subs.length; i++) {
      var s = MOCK.subs[i];
      if (s.source === source && (!scope || s.scope === scope)) n += 1;
    }
    return n;
  }

  function ensureScope() {
    var adminN = laneCount("relay", "admin");
    var userN = laneCount("relay", "user");
    var peopleN = laneCount("relay", "people");
    if (currentView === "relay") {
      if (currentScope === "admin" && adminN === 0 && userN > 0) currentScope = "user";
      if (currentScope === "user" && userN === 0 && adminN > 0) currentScope = "admin";
      if (currentScope === "people" && peopleN === 0 && adminN > 0) currentScope = "admin";
    }
  }

  function viewTitle() {
    if (currentView === "relay") {
      if (currentScope === "user") return "中转 · 我的";
      if (currentScope === "people") return "中转 · 用户";
      return "中转 · 全站";
    }
    return "本机";
  }

  function visibleSubs() {
    var out = [], i;
    if (!MOCK || !MOCK.subs) return out;
    for (i = 0; i < MOCK.subs.length; i++) {
      var s = MOCK.subs[i];
      var src = s.source || "local";
      if (currentView === "local") {
        if (src !== "local") continue;
        if (s.none || s.error) continue;
        if (s.windows && s.windows.length) out.push(s);
        else if (s.billing === "metered" && ((s.usage) || String(s.label || "").trim())) out.push(s);
      } else if (src === "relay" && s.scope === currentScope) {
        out.push(s);
      }
    }
    return out;
  }

    var s = String(raw || "").replace(/\s+(Max|Pro|Plus|Ultra|Build|Builder|Team|Lite|Free|API|订阅|进阶|基础|企业)$/i, "").trim();
    return s || String(raw || "");
  }

  function splitRelay(subs) {
    var head = [], rest = [], i;
    for (i = 0; i < subs.length; i++) {
      var k = subs[i].kind;
      if (k === "site" || k === "member" || k === "spend") head.push(subs[i]);
      else rest.push(subs[i]);
    }
    return { head: head, rest: rest };
  }

  function cardSub(s) {
    var label = String(s.label || "").trim();
    var title = String(s.tool || "").trim();
    var short = quotaToolName(title);
    var prefixes = [title, short];
    var i;
    for (i = 0; i < prefixes.length; i++) {
      var p = prefixes[i];
      if (!p) continue;
      if (label.indexOf(p + " \u00b7 ") === 0) label = label.substring(p.length + 3);
      else if (label === p) return "";
      else if (label.indexOf(p + " ") === 0) label = label.substring(p.length + 1);
    }
    return label === title || label === short ? "" : label;
  }

    if (att.background) parts.push("后台任务 " + att.background);
    var t = parts.length ? parts.join(" · ") : "进行中 0";

  function winRows(windows, tall) {
    if (!windows || !windows.length) {
      return '<span style="' + F(14) + '">还没有读数。</span>';
    }
    var html = '<table width="100%" cellpadding="' + px(3) + '" cellspacing="0" border="0">';
    var i;
    for (i = 0; i < windows.length; i++) {
      var w = windows[i];
      html += "<tr>" +
        '<td width="14%"><span style="' + F(tall ? 18 : 16) + '"><b>' + esc(w.key) + "</b></span></td>" +
        '<td width="52%">' + bar(w.pct, tall) + "</td>" +
        '<td width="14%" align="right" nowrap="nowrap"><span style="' + F(tall ? 18 : 16) + '"><b>' + esc(w.pct) + "%</b></span></td>" +
        '<td width="20%" align="right" nowrap="nowrap"><span style="' + F(tall ? 14 : 13) + '">' + esc(w.reset || "") + "</span></td>" +
        "</tr>";
    }
    return html + "</table>";
  }

  function meteredSpend(s) {
    var u = s && s.usage;
    if (u) {
      var h24 = usageSeg(u.h24Tokens, u.h24Cost);
      var d7 = usageSeg(u.d7Tokens, u.d7Cost);
      var parts = [];
      if (h24 && h24 !== "—") parts.push("24h " + h24);
      if (d7 && d7 !== "—") parts.push("7d " + d7);
      if (parts.length) return parts.join(" · ");
    }
    return cardSub(s) || "—";
  }

  function meteredRow(s, tall) {
    return '<table width="100%" cellpadding="' + px(3) + '" cellspacing="0" border="0"><tr>' +
      '<td width="14%"><span style="' + F(tall ? 18 : 16) + '"><b>按量</b></span></td>' +
      '<td><span style="' + F(tall ? 18 : 16) + ';display:block;overflow:hidden;white-space:nowrap;text-overflow:clip;"><b>' +
      esc(meteredSpend(s)) + "</b></span></td></tr></table>";
  }

  // 按量来源（sub2api）只有美元没有 token 数：tokens 为 "0" 时只留 ≈$，
  // 避免 "0 tok ≈$1.20" 这种噪音；两边都缺则整段显示 —。
  function usageSeg(tokens, cost) {
    var t = String(tokens || "—"), c = String(cost || "—");
    if (t === "0" && c !== "—") return "≈" + c;
    if (c === "—" && t !== "—") return t + " tok";
    if (c === "—" && t === "—") return "—";
    return t + " tok ≈" + c;
  }

  function usageLine(s) {
    var u = s && s.usage;
    if (!u) return "";
    return '<span style="' + F(13) + '">24h ' + esc(usageSeg(u.h24Tokens, u.h24Cost)) +
      " · 7d " + esc(usageSeg(u.d7Tokens, u.d7Cost)) + "</span>";
  }

  // 订阅 ≤2 份时用宽松卡：大标题 + 加高条，把省下的纵向空间用掉
  function quotaCard(s, tall) {
    var sub = cardSub(s);
    var extra = "";
    if (s.breakdown && s.kind === "member" && !isKindleUi()) {
      DETAIL.push(s);
      extra = SP(8) + tbtn("btn-detail-" + (DETAIL.length - 1), "详情");
    }
    var metered = s.billing === "metered";
    var head = '<div style="overflow:hidden;white-space:nowrap;text-overflow:clip;">' +
      '<span style="' + F(tall ? 26 : 22) + '"><b>' + esc(quotaToolName(s.tool)) + "</b></span>" +
      (!metered && sub ? '&nbsp;&nbsp;<span style="' + F(14) + '">' + esc(sub) + "</span>" : "") +
      "</div>";
    var usage = usageLine(s);
    if (s.none) {
      var hint = (s.source || "local") === "local" ? "" : (s.error ? "采集失败，保留上次读数。" : "");
      return card(head + (hint ? "<br>" + SP(4) + '<span style="' + F(14) + '">' + hint + "</span>" : "") +
        (usage ? "<br>" + SP(4) + usage : "") + extra);
    }
    if (metered) {
      return card(head + "<br>" + SP(6) + meteredRow(s, tall) + extra);
    }
    return card(head + "<br>" + SP(6) + winRows(s.windows, tall) +
      (usage ? SP(4) + usage : "") + extra);
  }

  function quotaCards(subs, emptyText, cols) {
    var i, c;
    if (!subs.length) {
      return card('<span style="' + F(16) + '">' + esc(emptyText) + "</span>");
    }
    var tall = subs.length <= 2;
    cols = cols || 1;
    if (subs.length === 1) cols = 1;
    if (cols < 2) {
      var single = "";
      for (i = 0; i < subs.length; i++) single += quotaCard(subs[i], tall);
      return single;
    }
    var html = '<table width="100%" cellpadding="0" cellspacing="' + px(6) + '" border="0">';
    var w = Math.floor(100 / cols);
    for (i = 0; i < subs.length; i += cols) {
      html += "<tr>";
      for (c = 0; c < cols; c++) {
        html += '<td width="' + w + '%" valign="top">' +
          (subs[i + c] ? quotaCard(subs[i + c], tall) : "&nbsp;") + "</td>";
      }
      html += "</tr>";
    }
    return html + "</table>";
  }

  function runCard(r) {
    var folder = runFolder(r);
    var when = runWhen(r);
    if (vp().w < 600) {
      return card(pill(r.tag) + '&nbsp;&nbsp;<span style="' + F(20) + '"><b>' + esc(r.title) +
        "</b></span><br>" + SP(6) +
        '<span style="' + F(14) + '">' + esc(r.detail) +
        (folder ? "<br>" + esc(folder) + " · " + esc(when) : (when ? "<br>" + esc(when) : "")) +
        "</span>");
    }
    return card('<table width="100%" cellpadding="0" cellspacing="0" border="0" style="table-layout:fixed;"><tr>' +
      '<td valign="top">' + pill(r.tag) + '&nbsp;&nbsp;<span style="' + F(22) + '"><b>' +
      esc(r.title) + "</b></span><br>" + SP(6) +
      '<span style="' + F(14) + '">' + esc(r.detail) + "</span></td>" +
      '<td width="' + LP(180) + '" valign="top" align="right" nowrap="nowrap">' +
      (folder ? '<span style="' + F(16) + '"><b>' + esc(folder) + "</b></span><br>" : "") +
      '<span style="' + F(14) + '">' + esc(when) + "</span></td>" +
      "</tr></table>");
  }

  function runCards(rows, emptyText) {
    if (!rows.length) {
      return emptyText ? card('<span style="' + F(16) + '">' + esc(emptyText) + "</span>") : "";
    }
    var html = "";
    var i;
    for (i = 0; i < rows.length; i++) html += runCard(rows[i]);
    return html;
  }

  function quotaLedgerRow(s, tall) {
    if (isScribe()) return scribeQuotaRow(s, tall);
    var sub = cardSub(s);
    var metered = s.billing === "metered";
    var name = '<span style="' + F(17) + '"><b>' + esc(quotaToolName(s.tool)) + "</b></span>" +
      (!metered && sub ? "<br>" + '<span style="' + F(12) + '">' + esc(sub) + "</span>" : "");
    var body;
    if (s.none) {
      body = usageLine(s) || '<span style="' + F(13) + '">还没有读数。</span>';
    } else if (metered) {
      body = meteredRow(s, false);
    } else {
      body = winRows(s.windows, false) + (usageLine(s) ? SP(2) + usageLine(s) : "");
    }
    return '<table width="100%" cellpadding="0" cellspacing="0" border="0"><tr>' +
      '<td width="' + LP(128) + '" valign="middle">' + name + "</td>" +
      '<td valign="middle">' + body + "</td>" +
      "</tr></table>";
  }

  // Scribe 限额行：品牌图标 + 名称套餐 | 细条窗口；不再堆 24h/7d 小字。
  function scribeQuotaRow(s, tall) {
    var sub = cardSub(s);
    var metered = s.billing === "metered";
    var name = '<table cellpadding="0" cellspacing="0" border="0"><tr>' +
      '<td valign="middle" style="padding-right:' + px(12) + 'px;">' + brandIcon(s.tool, px(tall ? 30 : 26)) + "</td>" +
      '<td valign="middle"><span style="' + F(tall ? 21 : 19) + '"><b>' + esc(quotaToolName(s.tool)) + "</b></span>" +
      (!metered && sub ? "<br>" + SP(2) + '<span style="' + F(tall ? 14 : 13) + 'color:' + INK2 + ';">' + esc(sub) + "</span>" : "") +
      "</td></tr></table>";
    var body;
    if (s.none) {
      body = '<span style="' + F(14) + 'color:' + INK3 + ';">' + esc(sub || "还没有读数。") + "</span>";
    } else if (metered) {
      body = '<span style="' + F(tall ? 18 : 16) + '"><b>按量</b></span>&nbsp;&nbsp;&nbsp;<span style="' + F(tall ? 17 : 15) +
        'color:' + INK2 + ';">' + esc(meteredSpend(s)) + "</span>";
    } else {
      body = scribeWinRows(s.windows, tall);
    }
    return '<table width="100%" cellpadding="0" cellspacing="0" border="0"><tr>' +
      '<td width="' + LP(210) + '" valign="middle">' + name + "</td>" +
      '<td valign="middle">' + body + "</td>" +
      "</tr></table>";
  }

  function quotaLedger(subs, emptyText) {
    if (isScribe()) {
      if (!subs.length) {
        return '<div style="padding:' + px(14) + 'px 0;"><span style="' + F(15) + 'color:' + INK3 + ';">' +
          esc(emptyText) + "</span></div>";
      }
      var tall = subs.length <= 4;
      var shtml = "";
      var si;
      for (si = 0; si < subs.length; si++) {
        shtml += '<div style="padding:' + px(tall ? 30 : 20) + 'px 0;">' + quotaLedgerRow(subs[si], tall) + "</div>";
        if (si < subs.length - 1) shtml += hairSoft();
      }
      return shtml;
    }
    if (!subs.length) {
      return '<div style="padding:' + px(8) + 'px 0;"><span style="' + F(15) + '">' + esc(emptyText) + "</span></div>";
    }
    var html = hair();
    var i;
    for (i = 0; i < subs.length; i++) {
      html += '<div style="padding:' + px(7) + 'px 0;">' + quotaLedgerRow(subs[i]) + "</div>" + hair();
    }
    return html + SP(4);
  }

  function runLedger(rows, emptyText) {
    if (isScribe()) return scribeRunRows(rows, emptyText);
    if (!rows.length) {
      return emptyText
        ? '<div style="padding:' + px(6) + 'px 0;"><span style="' + F(15) + '">' + esc(emptyText) + "</span></div>"
        : "";
    }
    var html = hair();
    var i;
    for (i = 0; i < rows.length; i++) {
      var r = rows[i];
      var folder = runFolder(r);
      var when = runWhen(r);
      html += '<div style="padding:' + px(7) + 'px 0;">' +
        '<table width="100%" cellpadding="0" cellspacing="0" border="0"><tr>' +
        '<td valign="top">' + pill(r.tag) + '&nbsp;&nbsp;<span style="' + F(18) + '"><b>' +
        esc(r.title) + "</b></span><br>" + SP(2) +
        '<span style="' + F(13) + '">' + esc(r.detail) + "</span></td>" +
        '<td width="' + LP(148) + '" valign="top" align="right" nowrap="nowrap">' +
        (folder ? '<span style="' + F(14) + '"><b>' + esc(folder) + "</b></span><br>" : "") +
        '<span style="' + F(13) + '">' + esc(when) + "</span></td>" +
        "</tr></table></div>" + hair();
    }
    return html + SP(4);
  }

  // Scribe 任务行：状态 + 单行标题 | 目录 · 时间；detail 不上屏，最多 8 行。
  function scribeRunRows(rows, emptyText) {
    if (!rows.length) {
      return emptyText
        ? '<div style="padding:' + px(14) + 'px 0;"><span style="' + F(15) + 'color:' + INK3 + ';">' +
          esc(emptyText) + "</span></div>"
        : "";
    }
    var MAXR = 8;
    var more = rows.length > MAXR ? rows.length - MAXR : 0;
    if (more) rows = rows.slice(0, MAXR);
    var html = "";
    var i;
    for (i = 0; i < rows.length; i++) {
      var r = rows[i];
      var folder = runFolder(r);
      var when = runWhen(r);
      html += '<div style="padding:' + px(16) + 'px 0;">' +
        '<table width="100%" cellpadding="0" cellspacing="0" border="0" style="table-layout:fixed;"><tr>' +
        '<td valign="middle"><div style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">' +
        pill(r.tag) + '&nbsp;&nbsp;<span style="' + F(18) + '"><b>' + esc(r.title) + "</b></span></div></td>" +
        '<td width="' + LP(230) + '" valign="middle" align="right" nowrap="nowrap">' +
        (folder ? '<span style="' + F(14) + 'color:' + INK2 + ';">' + esc(folder) + "</span>" : "") +
        (folder && when ? '<span style="' + F(13) + 'color:' + INK3 + ';"> · </span>' : "") +
        '<span style="' + F(13) + 'color:' + INK3 + ';">' + esc(when) + "</span></td>" +
        "</tr></table></div>";
      if (i < rows.length - 1 || more) html += hairSoft();
    }
    if (more) {
      html += '<div style="padding:' + px(10) + 'px 0;"><span style="' + F(13) + 'color:' + INK3 + ';">另有 ' +
        more + " 项</span></div>";
    }
    return html;
  }

  function hostCard(h) {
    var meta = isScribe()
      ? '<span style="' + F(14) + '"><b>' + (h.ok ? "在线" : "陈旧") + "</b> · " + esc(h.seen) + "</span>"
      : '<span style="' + F(14) + '"><b>' + (h.ok ? "在线" : "陈旧") + "</b> · " + esc(h.seen) +
        "<br>" + esc(attentionText(h.attention, !h.ok)) +
        (h.sessions != null ? "<br>会话 " + esc(h.sessions) : "") +
        (h.tokens ? " · 今日 " + esc(h.tokens) : "") + "</span>";
    return '<table width="100%" cellpadding="' + px(isScribe() ? 10 : 12) + '" cellspacing="0" border="1" bordercolor="' +
      INK + '"><tr><td>' +
      '<span style="' + F(12) + ";letter-spacing:" + px(1) + 'px;">' + esc(h.role || "HOST") + "</span><br>" + SP(2) +
      '<span style="' + F(isScribe() ? 22 : 20) + '"><b>' + esc(h.name) + "</b></span><br>" + SP(4) +
      meta +
      "</td></tr></table>";
  }

  function hostStrip() {
    var hosts = (MOCK && MOCK.hosts) || [];
    if (!hosts.length) return "";
    if (isWideBoard()) {
      var bits = [];
      var i;
      for (i = 0; i < hosts.length; i++) {
        var h = hosts[i];
        var line = esc(h.name) + " · " + (h.ok ? "在线" : "陈旧") + " · " + esc(h.seen);
        if (h.attention && (h.attention.human || h.attention.waiting || h.attention.background)) {
          line += " · " + esc(attentionText(h.attention, !h.ok));
        }
        bits.push(line);
      }
      return '<span style="' + F(14) + '">' + bits.join("&nbsp;&nbsp;&nbsp;") + "</span>" + SP(8);
    }
    var perRow = hosts.length > 4 ? 4 : hosts.length;
    var html = '<table width="100%" cellpadding="0" cellspacing="' + px(8) + '" border="0">';
    var i;
    for (i = 0; i < hosts.length; i++) {
      if (i % perRow === 0) html += "<tr>";
      html += '<td width="' + Math.floor(100 / perRow) + '%" valign="top">' + hostCard(hosts[i]) + "</td>";
      if (i % perRow === perRow - 1 || i === hosts.length - 1) html += "</tr>";
    }
    return html + "</table>" + SP(4);
  }

  function masthead() {
    if (isScribe()) return scribeMasthead();
    var tabs = inkTab("ink-local", "本机", currentView === "local") + "&nbsp;&nbsp;&nbsp;" +
      inkTab("ink-relay", "中转", currentView === "relay");
    if (currentView === "relay") {
      tabs += "&nbsp;&nbsp;&nbsp;&nbsp;" +
        inkTab("ink-admin", "全站", currentScope === "admin") + "&nbsp;&nbsp;&nbsp;" +
        inkTab("ink-user", "我的", currentScope === "user") + "&nbsp;&nbsp;&nbsp;" +
        inkTab("ink-people", "用户", currentScope === "people");
    }
    var brandIcon = isKindleUi()
      ? ""
      : '<td valign="middle" style="padding-right:' + px(10) + 'px;">' +
        '<img src="brand/icon-32.png" width="' + px(36) + '" height="' + px(36) + '" alt=""></td>';
    var brand = '<table cellpadding="0" cellspacing="0" border="0"><tr>' +
      brandIcon +
      '<td valign="middle">' +
      '<span id="ink-help" style="cursor:pointer;' + F(38) + ";letter-spacing:" +
      px(2) + 'px;"><b>AINDLE</b></span><br>' +
      '<span style="' + F(13) + ";letter-spacing:" + px(2) + 'px;">AI MONITOR' +
      (isScribe() ? "" : " · " + esc(viewTitle())) + "</span>" +
      "</td></tr></table>";
    var clockMeta = isScribe()
      ? esc(MOCK.date) + " · Hub " + esc(MOCK.hub) + " · " + ((MOCK.hosts || []).length) + " 机"
      : esc(MOCK.date) + " · Hub " + esc(MOCK.hub) + " · " + esc(globalAttention());
    var clock = '<span id="ink-clock" style="cursor:pointer;' + F(38) + '"><b>' +
      esc(MOCK.time) + "</b></span><br>" +
      '<span style="' + F(13) + '">' + clockMeta + "</span>";
    if (vp().w < 600) {
      return '<table width="100%" cellpadding="0" cellspacing="0" border="0"><tr>' +
        '<td valign="bottom">' + brand + "</td>" +
        '<td valign="bottom" align="right">' + clock + "</td>" +
        "</tr></table>" + SP(10) + tabs + SP(4) + rule(px(3)) + SP(6);
    }
    return '<table width="100%" cellpadding="0" cellspacing="0" border="0"><tr>' +
      '<td valign="bottom">' + brand + "</td>" +
      '<td valign="bottom" align="center" nowrap="nowrap">' + tabs + "</td>" +
      '<td valign="bottom" align="right">' + clock + "</td>" +
      "</tr></table>" + SP(10) + rule(px(3)) + SP(6);
  }

  /* ---------- Scribe 大屏版式（优雅优先：大留白、衬线报头、三档灰、细线账本） ---------- */

  function scribeMasthead() {
    var tabs = inkTab("ink-local", "本机", currentView === "local") + "&nbsp;&nbsp;&nbsp;" +
      inkTab("ink-relay", "中转", currentView === "relay");
    if (currentView === "relay") {
      tabs += "&nbsp;&nbsp;&nbsp;&nbsp;" +
        inkTab("ink-admin", "全站", currentScope === "admin") + "&nbsp;&nbsp;&nbsp;" +
        inkTab("ink-user", "我的", currentScope === "user") + "&nbsp;&nbsp;&nbsp;" +
        inkTab("ink-people", "用户", currentScope === "people");
    }
    var dateStr = String(MOCK.date || "");
    var dm = dateStr.match(/^(周\S{1,3})\s*(\d{1,2}月\d{1,2}日)$/);
    if (dm) dateStr = dm[2] + "  " + dm[1];
    var wordmark =
      '<span id="ink-help" style="cursor:pointer;' + F(15) + "font-weight:700;letter-spacing:" + px(4) +
      'px;">AINDLE</span>&nbsp;&nbsp;<span style="' + F(14) + "color:" + INK3 + ";letter-spacing:" + px(2) +
      'px;">' + esc(viewTitle()) + "</span>";
    return '<table width="100%" cellpadding="0" cellspacing="0" border="0"><tr>' +
      '<td valign="bottom"><span style="' + F(46) + "font-family:" + SERIF + ';">' + esc(dateStr) + "</span></td>" +
      '<td valign="bottom" align="right" nowrap="nowrap">' + wordmark + "<br>" + SP(4) +
      '<span id="ink-clock" style="cursor:pointer;' + F(52) + "font-family:" + SERIF +
      ';font-variant-numeric:tabular-nums;">' + esc(MOCK.time) + "</span></td>" +
      "</tr></table>" + SP(14) + tabs + SP(12) + rule(px(2));
  }

  function scribeBar(pct, tall) {
    pct = Math.round(Number(pct) || 0);
    if (pct < 0) pct = 0;
    if (pct > 100) pct = 100;
    var rest = 100 - pct;
    var h = tall ? px(13) : px(10);
    return '<table width="100%" cellpadding="0" cellspacing="0" border="1" bordercolor="' + INK + '"><tr>' +
      '<td width="' + pct + '%"' + (pct > 0 ? ' bgcolor="' + INK + '"' : "") + ' height="' + h +
      '"><span style="font-size:1px;">&nbsp;</span></td>' +
      (rest > 0
        ? '<td width="' + rest + '%" bgcolor="#FFFFFF" height="' + h + '"><span style="font-size:1px;">&nbsp;</span></td>'
        : "") +
      "</tr></table>";
  }

  function scribeWinRows(windows, tall) {
    if (!windows || !windows.length) {
      return '<span style="' + F(14) + 'color:' + INK3 + ';">还没有读数。</span>';
    }
    var html = '<table width="100%" cellpadding="' + px(4) + '" cellspacing="0" border="0">';
    var i;
    for (i = 0; i < windows.length; i++) {
      var w = windows[i];
      html += "<tr>" +
        '<td width="12%"><span style="' + F(tall ? 17 : 15) + '"><b>' + esc(w.key) + "</b></span></td>" +
        '<td width="55%">' + scribeBar(w.pct, tall) + "</td>" +
        '<td width="13%" align="right" nowrap="nowrap"><span style="' + F(tall ? 17 : 15) +
        ';font-variant-numeric:tabular-nums;"><b>' + esc(w.pct) + "%</b></span></td>" +
        '<td width="20%" align="right" nowrap="nowrap"><span style="' + F(tall ? 14 : 13) + 'color:' + INK3 + ';">' +
        esc(w.reset || "") + "</span></td>" +
        "</tr>";
    }
    return html + "</table>";
  }

  /* ---------- 小屏账本（pocket）：锁屏设计语言的 web 移植，单页滚动 ---------- */

  function isNarrow() {
    return vp().w < 700;
  }

  // 胶囊条：外框圆角 + 内芯；<90% 用斜纹软填充减少墨色，老 WebKit 不认渐变时
  // bgcolor 兜底为实心黑条，版面不塌。
  function pocketBar(pct, tall) {
    pct = Math.round(Number(pct) || 0);
    if (pct < 0) pct = 0;
    if (pct > 100) pct = 100;
    var fill = pct >= 90
      ? '<div style="height:100%;background:' + INK + ';"></div>'
      : '<div bgcolor="' + INK + '" style="height:100%;background:' + INK +
        ';background:repeating-linear-gradient(-45deg,' + INK + ' 0 3px,#FFFFFF 3px 7px);"></div>';
    return '<div style="width:' + pct + '%;height:100%;">' + fill + "</div>";
  }

  function pocketBarFrame(pct, tall) {
    var h = tall ? px(14) : px(10);
    var bw = isNarrow() ? 1 : 2;
    return '<div style="height:' + h + 'px;border:' + bw + 'px solid ' + INK +
      ';border-radius:999px;-webkit-border-radius:999px;background:#FFFFFF;overflow:hidden;">' +
      pocketBar(pct, tall) + "</div>";
  }

  /* pickWindows：与 eink.ts 同源的「车道」选择——burst/free/week/cycle 各取最热一条，最多 2 条 */
  function prettyWinKey(key) {
    if (/^api$/i.test(key)) return "三方";
    if (/^(auto|自由)$/i.test(key)) return "自有";
    return key;
  }

  function windowLane(key) {
    var k = String(key || "").toLowerCase();
    if (/fable|opus|sonnet|5h|三方|api|session/.test(k)) return "burst";
    if (/自由|自有|auto/.test(k)) return "free";
    if (/7d|本周|week/.test(k)) return "week";
    if (/账期|月|billing|cycle/.test(k)) return "cycle";
    return "other";
  }

  function bestInLane(windows, lane) {
    var best = null;
    var i;
    for (i = 0; i < windows.length; i++) {
      var w = windows[i];
      if (windowLane(w.key) !== lane) continue;
      if (!best || w.pct > best.pct || (w.pct === best.pct && String(w.key) < String(best.key))) best = w;
    }
    return best;
  }

  function pickWindows(windows) {
    if (!windows) return [];
    if (windows.length <= 1) return windows;
    var unique = [];
    var seen = {};
    var i;
    for (i = 0; i < windows.length; i++) {
      var k = String(windows[i].key);
      if (seen[k]) continue;
      seen[k] = 1;
      unique.push(windows[i]);
    }
    var burst = bestInLane(unique, "burst");
    var free = bestInLane(unique, "free");
    var week = bestInLane(unique, "week");
    var cycle = bestInLane(unique, "cycle");
    if (burst && free) return [burst, free];
    if (burst && week) return [burst, week];
    if (free && week) return [free, week];
    if (burst && cycle) return [burst, cycle];
    if (week && cycle) return [week, cycle];
    return unique.sort(function (a, b) { return b.pct - a.pct; }).slice(0, 2);
  }

  function pocketMeter(w, tall) {
    return '<table width="100%" cellpadding="0" cellspacing="0" border="0"><tr>' +
      '<td width="' + px(tall ? 64 : 48) + '"><span style="' + F(tall ? 16 : 14) + '"><b>' +
      esc(prettyWinKey(w.key)) + "</b></span></td>" +
      "<td>" + pocketBarFrame(w.pct, tall) + "</td>" +
      '<td width="' + px(tall ? 62 : 50) + '" align="right" nowrap="nowrap"><span style="' + F(tall ? 20 : 16) +
      ';font-variant-numeric:tabular-nums;"><b>' + esc(Math.round(Number(w.pct) || 0)) + "%</b></span></td>" +
      '<td width="' + px(88) + '" align="right" nowrap="nowrap"><span style="' + F(12) + 'color:' + INK3 + ';">' +
      esc(w.reset || "") + "</span></td>" +
      "</tr></table>";
  }

  // sub 展示策略：紧凑宽行只要名字（防换行），宽松大卡换行展示，窄屏整行宽内联。
  function pocketNameCell(s, big, inlineSub) {
    var sub = cardSub(s);
    var metered = s.billing === "metered";
    var showSub = !metered && sub && (inlineSub || big);
    return '<table cellpadding="0" cellspacing="0" border="0"><tr>' +
      '<td valign="middle" style="padding-right:' + px(10) + 'px;">' + brandIcon(s.tool, px(big ? 30 : 24)) + "</td>" +
      '<td valign="middle"><span style="' + F(big ? 24 : 19) + '"><b>' + esc(quotaToolName(s.tool)) + "</b></span>" +
      (showSub && inlineSub ? '&nbsp;&nbsp;<span style="' + F(12) + 'color:' + INK2 + ';">' + esc(sub) + "</span>" : "") +
      (showSub && !inlineSub ? "<br>" + SP(2) + '<span style="' + F(14) + 'color:' + INK2 + ';">' + esc(sub) + "</span>" : "") +
      "</td></tr></table>";
  }

  // 宽小屏（≥700px）：锁屏 qrow——名称 │ 竖线 │ 双窗条并排
  function pocketQuotaRowWide(s) {
    var metered = s.billing === "metered";
    var wins = pickWindows(s.windows);
    var meters;
    if (s.none) {
      meters = '<span style="' + F(13) + 'color:' + INK3 + ';">' + esc(cardSub(s) || "还没有读数。") + "</span>";
    } else if (metered) {
      meters = '<span style="' + F(15) + '"><b>按量</b></span>&nbsp;&nbsp;<span style="' + F(14) +
        'color:' + INK2 + ';">' + esc(meteredSpend(s)) + "</span>";
    } else if (!wins.length) {
      meters = '<span style="' + F(13) + 'color:' + INK3 + ';">还没有读数。</span>';
    } else {
      meters = "<tr>" + pocketMeterCell(wins[0]) + (wins[1] ? pocketMeterCell(wins[1]) : "") + "</tr>";
      meters = '<table width="100%" cellpadding="0" cellspacing="0" border="0">' + meters + "</table>";
    }
    return '<table width="100%" cellpadding="0" cellspacing="0" border="0"><tr>' +
      '<td width="' + LP(190) + '" valign="middle">' + pocketNameCell(s, false) + "</td>" +
      '<td width="' + px(14) + '"></td>' +
      '<td width="1" bgcolor="' + LINE + '"><span style="font-size:1px;">&nbsp;</span></td>' +
      '<td width="' + px(14) + '"></td>' +
      '<td valign="middle">' + meters + "</td>" +
      "</tr></table>";
  }

  function pocketMeterCell(w) {
    return '<td width="50%" style="padding-right:' + px(12) + 'px;">' +
      '<table width="100%" cellpadding="0" cellspacing="0" border="0"><tr>' +
      '<td width="' + px(40) + '"><span style="' + F(14) + '"><b>' + esc(prettyWinKey(w.key)) + "</b></span></td>" +
      "<td>" + pocketBarFrame(w.pct, false) + "</td>" +
      '<td width="' + px(48) + '" align="right" nowrap="nowrap"><span style="' + F(16) +
      ';font-variant-numeric:tabular-nums;"><b>' + esc(Math.round(Number(w.pct) || 0)) + "%</b></span></td>" +
      "</tr></table></td>";
  }

  // 窄屏（<700px）：名称一行，窗口各自一行（含 reset）
  function pocketQuotaRowNarrow(s, tall) {
    var metered = s.billing === "metered";
    var wins = tall ? (s.windows || []).slice(0, 3) : pickWindows(s.windows);
    var body = "";
    var i;
    if (s.none) {
      body = '<div style="padding-top:' + px(6) + 'px;"><span style="' + F(13) + 'color:' + INK3 + ';">' +
        esc(cardSub(s) || "还没有读数。") + "</span></div>";
    } else if (metered) {
      body = '<div style="padding-top:' + px(6) + 'px;"><span style="' + F(15) + '"><b>按量</b></span>&nbsp;&nbsp;' +
        '<span style="' + F(14) + 'color:' + INK2 + ';">' + esc(meteredSpend(s)) + "</span></div>";
    } else if (!wins.length) {
      body = '<div style="padding-top:' + px(6) + 'px;"><span style="' + F(13) + 'color:' + INK3 + ';">还没有读数。</span></div>';
    } else {
      for (i = 0; i < wins.length; i++) {
        body += '<div style="padding-top:' + px(7) + 'px;">' + pocketMeter(wins[i], tall) + "</div>";
      }
      if (tall && !metered && s.usage) {
        body += '<div style="padding-top:' + px(8) + 'px;"><span style="' + F(12) + 'color:' + INK3 + ';">24h ' +
          esc(usageSeg(s.usage.h24Tokens, s.usage.h24Cost)) + " · 7d " +
          esc(usageSeg(s.usage.d7Tokens, s.usage.d7Cost)) + "</span></div>";
      }
    }
    return pocketNameCell(s, tall, true) + body;
  }

  // ≤3 份的宽松行（宽小屏）：大名称 + 每窗口独占一行 + 用量行
  function pocketQuotaBigWide(s) {
    var metered = s.billing === "metered";
    var wins = (s.windows || []).slice(0, 3);
    var body = "";
    var i;
    if (s.none) {
      body = '<span style="' + F(14) + 'color:' + INK3 + ';">' + esc(cardSub(s) || "还没有读数。") + "</span>";
    } else if (metered) {
      body = '<span style="' + F(16) + '"><b>按量</b></span>&nbsp;&nbsp;<span style="' + F(15) +
        'color:' + INK2 + ';">' + esc(meteredSpend(s)) + "</span>";
    } else {
      for (i = 0; i < wins.length; i++) {
        body += '<div style="padding-top:' + px(8) + 'px;">' + pocketMeter(wins[i], true) + "</div>";
      }
      if (!wins.length) body = '<span style="' + F(13) + 'color:' + INK3 + ';">还没有读数。</span>';
      else if (s.usage) {
        body += '<div style="padding-top:' + px(8) + 'px;"><span style="' + F(12) + 'color:' + INK3 + ';">24h ' +
          esc(usageSeg(s.usage.h24Tokens, s.usage.h24Cost)) + " · 7d " +
          esc(usageSeg(s.usage.d7Tokens, s.usage.d7Cost)) + "</span></div>";
      }
    }
    return '<table width="100%" cellpadding="0" cellspacing="0" border="0"><tr>' +
      '<td width="' + LP(230) + '" valign="top">' + pocketNameCell(s, true) + "</td>" +
      '<td valign="top">' + body + "</td>" +
      "</tr></table>";

  function pocketQuotas(subs, emptyText) {
    if (!subs.length) {
      return '<div style="padding:' + px(12) + 'px 0;"><span style="' + F(14) + 'color:' + INK3 + ';">' +
        esc(emptyText) + "</span></div>";
    }
    var big = subs.length <= 3;
    var narrow = isNarrow();
    var html = "";
    var i;
    for (i = 0; i < subs.length; i++) {
      var row = narrow
        ? pocketQuotaRowNarrow(subs[i], big)
        : big ? pocketQuotaBigWide(subs[i]) : pocketQuotaRowWide(subs[i]);
      html += '<div style="padding:' + px(big ? 14 : 11) + "px 0;\">" + row + "</div>";
      if (i < subs.length - 1) html += hairSoft();
    }
    return html;
  }

  function pocketRunRow(r) {
    var folder = runFolder(r);
    var when = runWhen(r);
    return '<table width="100%" cellpadding="0" cellspacing="0" border="0" style="table-layout:fixed;"><tr>' +
      '<td valign="middle"><div style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">' +

      '<span style="' + F(13) + 'color:' + INK3 + ';">' + esc(when) + "</span>" +
      (folder && !isNarrow() ? '&nbsp;&nbsp;<span style="' + F(13) + 'color:' + INK2 + ';">' + esc(folder) + "</span>" : "") +
      "</td></tr></table>";

  function pocketRuns(rows, emptyText, cap) {
    if (!rows.length) {
      return emptyText
        ? '<div style="padding:' + px(10) + 'px 0;"><span style="' + F(14) + 'color:' + INK3 + ';">' +
          esc(emptyText) + "</span></div>"
        : "";
    }
    var more = rows.length > cap ? rows.length - cap : 0;
    if (more) rows = rows.slice(0, cap);
    var html = "";
    var i;
    for (i = 0; i < rows.length; i++) {
      html += '<div style="padding:' + px(10) + 'px 0;">' + pocketRunRow(rows[i]) + "</div>";
      if (i < rows.length - 1 || more) html += hairSoft();
    }
    if (more) {
      html += '<div style="padding:' + px(8) + 'px 0;"><span style="' + F(12) + 'color:' + INK3 + ';">另有 ' +
        more + " 项</span></div>";
    }
    return html;
  }

  function pocketSection(title, extra) {
    return SP(20) +
      '<table width="100%" cellpadding="0" cellspacing="0" border="0"><tr>' +
      '<td><span style="' + F(16) + 'font-weight:700;letter-spacing:' + px(3) + 'px;">' + esc(title) + "</span>" +
      (extra ? '&nbsp;&nbsp;<span style="' + F(13) + 'color:' + INK3 + ';">' + esc(extra) + "</span>" : "") +
      "</td></tr></table>" + SP(7) + hairSoft() + SP(1);
  }

  function pocketMasthead() {
    var tabs = inkTab("ink-local", "本机", currentView === "local") + "&nbsp;&nbsp;&nbsp;" +
      inkTab("ink-relay", "中转", currentView === "relay");
    var dateStr = String(MOCK.date || "");
    var dm = dateStr.match(/^(周\S{1,3})\s*(\d{1,2}月\d{1,2}日)$/);
    if (dm) dateStr = dm[2] + "  " + dm[1];
    var narrow = isNarrow();
    return '<table width="100%" cellpadding="0" cellspacing="0" border="0"><tr>' +
      '<td valign="bottom"><span style="' + F(narrow ? 30 : 40) + "font-family:" + SERIF + ';">' +
      esc(dateStr) + "</span></td>" +
      '<td valign="bottom" align="right" nowrap="nowrap">' +
      '<span id="ink-help" style="cursor:pointer;' + F(13) + "font-weight:700;letter-spacing:" + px(3) +
      'px;">AINDLE</span>&nbsp;&nbsp;<span style="' + F(13) + 'color:' + INK3 + ';">' + esc(viewTitle()) + "</span>" +
      "</td></tr></table>" + SP(10) + tabs + SP(8) + rule(px(2));
  }

  // 什么数据都没有时的整块空页，而不是三条空态的堆叠。
  function pocketEmpty() {
    return '<div style="padding:' + px(70) + 'px 0;text-align:center;">' +
      '<span style="' + F(24) + "font-weight:700;letter-spacing:" + px(6) + 'px;">AINDLE</span><br>' +
      SP(18) + '<span style="' + F(16) + 'color:' + INK2 + ';">现在没有任务在跑，也没有限额读数。</span><br>' +
      SP(8) + '<span style="' + F(13) + 'color:' + INK3 + ';">数据 ' + esc(shortTime(MOCK.generatedAt)) +
      " · Hub " + esc(MOCK.hub) + "</span></div>";
  }

  function maxSubPct(s) {
    var m = 0;
    var ws = s.windows || [];
    var i;
    for (i = 0; i < ws.length; i++) if (ws[i].pct > m) m = ws[i].pct;
    return m;
  }

  function pocketLocal() {
    var subs = visibleSubs();
    var live = liveNow();
    var recent = (MOCK && MOCK.recent) || [];
    if (!subs.length && !live.length && !recent.length) return pocketEmpty();
    var moreSubs = 0;
    if (subs.length > 8) {
      subs = subs.sort(function (a, b) { return maxSubPct(b) - maxSubPct(a); });
      moreSubs = subs.length - 8;
      subs = subs.slice(0, 8);
    }
    var html = pocketSection("限额", subs.length + " 份") + pocketQuotas(subs, "还没有本机限额。");
    if (moreSubs) {
      html += '<div style="padding:' + px(8) + 'px 0;"><span style="' + F(12) + 'color:' + INK3 + ';">另有 ' +
        moreSubs + " 份</span></div>";
    }
    html += pocketSection("进行中", liveAttention(live)) +
      pocketRuns(live, "这一小时没有进行中的会话。", 10);
    if (recent.length) {
      html += pocketSection("已完成", recent.length + " 条") + pocketRuns(recent, "", 6);
    }
    return html;
  }

  // 进行中段标题右侧：总数 + 待确认/后台拆分（不与标题重字）。
  function liveAttention(live) {
    var att = (MOCK && MOCK.attention) || {};
    var extra = live.length + " 项";
    var parts = [];
    if (att.waiting) parts.push("待确认 " + att.waiting);
    if (att.background) parts.push("后台 " + att.background);
    if (parts.length) extra += " · " + parts.join(" · ");
    return extra;
  }

  function todaySpend(label) {
    var m = String(label || "").match(/今日 \$[0-9.]+/);
    return m ? m[0] : "";
  }

  function pocketRelay() {
    var subs = MOCK.subs || [];
    var site = null, mine = null;
    var accounts = [], people = [];
    var i;
    for (i = 0; i < subs.length; i++) {
      var s = subs[i];
      if (s.source !== "relay") continue;
      if (s.kind === "site") site = s;
      if (s.scope === "user" && s.kind === "member") mine = s;
      if (s.scope === "admin" && s.kind === "account" && !s.none && (s.windows || []).length) accounts.push(s);
      if (s.scope === "people" && /今日 \$[1-9]|今日 \$\d+\.\d*[1-9]/.test(s.label || "")) people.push(s);
    }
    accounts = accounts.sort(function (a, b) { return maxSubPct(b) - maxSubPct(a); })
      .filter(function (s) { return maxSubPct(s) >= 5; }).slice(0, 6);
    people = people.slice(0, 3);
    var html = "";
    if (site) {
      html += '<div style="padding:' + px(10) + 'px 0;"><span style="' + F(13) + 'color:' + INK3 + ';">全站</span>&nbsp;&nbsp;' +
        '<span style="' + F(15) + '"><b>' + esc(cardSub(site)) + "</b></span></div>";
    }
    if (people.length) {
      var bits = [];
      for (i = 0; i < people.length; i++) {
        bits.push(esc(quotaToolName(people[i].tool)) + " " + esc(todaySpend(people[i].label)));
      }
      html += '<div style="padding:0 0 ' + px(8) + 'px;"><span style="' + F(13) + 'color:' + INK2 +
        ';">今日活跃：' + bits.join(" · ") + "</span></div>";
    }
    if (mine) {
      html += '<div style="padding:0 0 ' + px(8) + 'px;"><span style="' + F(13) + 'color:' + INK2 +
        ';">我的 · ' + esc(cardSub(mine)) + "</span></div>";
    }
    if (!site && !accounts.length && !mine) return pocketEmpty();
    html += pocketSection("上游", accounts.length + " 张") +
      pocketQuotas(accounts, "上游账号还没有读数。");
    return html;
  }

      "</tr></table>";
  }

  // 进行中栏右上角的小字拆分：待确认 / 后台（进行中本身已在标题里）。
  function attentionSide() {
    var att = (MOCK && MOCK.attention) || {};
    var parts = [];
    if (att.waiting) parts.push("待确认 " + att.waiting);
    if (att.background) parts.push("后台 " + att.background);
    return parts.join(" · ");
  }

  function boardColumns(subs, live, recent) {
    if (isScribe()) {
      var t = MOCK && MOCK.usageTotal;
      var quota = section("限额", subs.length + " 份",
          t ? "24h " + t.h24Tokens + " tok ≈" + t.h24Cost + " · 7d " + t.d7Tokens + " tok ≈" + t.d7Cost : "") +
        quotaLedger(subs, "还没有本机限额。");
      var liveCol = section("进行中", live.length + " 项", attentionSide()) +
        runLedger(live, "这一小时没有进行中的会话。");
      var doneCol = section("已完成", recent.length + " 条") +
        runLedger(recent, "近 1 小时没有已完成。");
      return quota +
        '<table width="100%" cellpadding="0" cellspacing="0" border="0"><tr>' +
        '<td width="50%" valign="top"><div style="padding-right:' + px(26) + 'px;">' + liveCol + "</div></td>" +
        '<td width="50%" valign="top"><div style="padding-left:' + px(26) + 'px;">' + doneCol + "</div></td>" +
        "</tr></table>";
    }
    var quota = section("限额", subs.length + " 份") +
      quotaLedger(subs, "还没有本机限额。");
    var liveCol = section("进行中", String(live.length)) +
      runLedger(live, "这一小时没有进行中的会话。");
    var doneCol = section("已完成", String(recent.length)) +
      runLedger(recent, "近 1 小时没有已完成。");
    if (wantSplitBoard()) {
      return quota +
        '<table width="100%" cellpadding="0" cellspacing="' + px(16) + '" border="0"><tr>' +
        '<td width="50%" valign="top">' + liveCol + "</td>" +
        '<td width="50%" valign="top">' + doneCol + "</td>" +
        "</tr></table>";
    }
    if (!live.length) {
      return quota + (recent.length ? doneCol : "");
    }
    return quota + liveCol + (recent.length ? doneCol : "");
  }

  function editionScribe() {
    return boardColumns(visibleSubs(), liveNow(), (MOCK && MOCK.recent) || []);
  }

  function editionLocal() {
    if (isScribe() || isWideBoard()) return editionScribe();
    var subs = visibleSubs();
    var live = liveNow();
    var recent = (MOCK && MOCK.recent) || [];
    var leftCol = section("限额", subs.length + " 份") +
      quotaCards(subs, "还没有本机限额。", vp().w >= 1600 ? 2 : 1);
    var rightCol = section("进行中 · 待确认 · 后台任务", globalAttention()) +
      runCards(live, "这一小时没有进行中的会话。") +
      (recent.length ? section("近 1 小时", recent.length + " 条") + runCards(recent, "") : "");
    return leftCol + (live.length ? rightCol : (recent.length ? section("近 1 小时", recent.length + " 条") + runCards(recent, "") : ""));
  }

  function editionRelay() {
    var subs = visibleSubs();
    var parts = splitRelay(subs);
    var emptyAll = currentScope === "user"
      ? "还没有中转用户数据。"
      : currentScope === "people"
        ? "还没有其他用户。"
        : "还没有中转全站数据。";
    var emptyRest = currentScope === "user" ? "还没有 Key。" : "上游账号还没有读数。";
    if (currentScope === "people") {
      return section("用户", subs.length + " 人") +
        (isScribe() ? quotaLedger(subs, emptyAll) : quotaCards(subs, emptyAll, cardCols()));
    }
    var leftName = currentScope === "user" ? "用量" : "概览";
    var rightName = currentScope === "user" ? "Key" : "上游";
    if (isScribe()) {
      return section(leftName, parts.head.length + " 张") + quotaLedger(parts.head, emptyAll) +
        section(rightName, parts.rest.length + " 张") + quotaLedger(parts.rest, emptyRest);
    }
    var leftCol = section(leftName, parts.head.length + " 张") + quotaCards(parts.head, emptyAll, 1);
    var rightCol = section(rightName, parts.rest.length + " 张") + quotaCards(parts.rest, emptyRest, 1);
    if (vp().w >= 1000) {
      return '<table width="100%" cellpadding="0" cellspacing="' + px(10) + '" border="0"><tr>' +
        '<td width="50%" valign="top">' + leftCol + "</td>" +
        '<td width="50%" valign="top">' + rightCol + "</td>" +
        "</tr></table>";
    }
    return leftCol + rightCol;
  }

  function usageBanner() {
    var t = MOCK && MOCK.usageTotal;
    if (!t) return "";
    return SP(4) + hair() + SP(4) +
      '<table width="100%" cellpadding="0" cellspacing="0" border="0"><tr>' +
      '<td align="right"><span style="' + F(14) + '">消耗 · 24h ' + esc(t.h24Tokens) +
      " tok ≈" + esc(t.h24Cost) + " · 7d " + esc(t.d7Tokens) + " tok ≈" + esc(t.d7Cost) +
      "</span></td></tr></table>" + SP(6);
  }

  function renderFull() {
    var html;
    if (isScribe()) {
      // Scribe：无主机条、无消耗横幅，报头 + 版面 + 页脚。
      html = masthead() + (currentView === "relay" ? editionRelay() : editionLocal()) + editionFooter();
    } else {
      html = masthead() + hostStrip();
      html += currentView === "relay" ? editionRelay() : (usageBanner() + editionLocal());
      html += editionFooter();
    }
    var pad = px(isScribe() ? 64 : 18);
    document.getElementById("view-full").innerHTML =
      '<div style="padding:' + px(isScribe() ? 44 : 14) + "px " + pad + "px " +
      px(isScribe() ? 36 : 16) + "px " + pad + 'px;">' +
      html + "</div>";
  }

  function fitScribeCanvas() {
    if (!isScribe()) return;
    var box = document.getElementById("view-full");
    if (!box) return;
    var need = box.scrollHeight || 0;
    var room = vp().h;
    if (need < 80 || room < 80 || need <= room + 6) return;
    var next = S * (room / need) * 0.96;
    if (next < 0.88) next = 0.88;
    if (next >= S - 0.01) return;
    S = next;
    renderTop();
    renderFull();
    applyMode();
    pinScribeFooter();
  }

  // 内容不足一屏时把页脚压到版面底部，像印件的版权行。
  function pinScribeFooter() {
    if (!isScribe()) return;
    var box = document.getElementById("view-full");
    var foot = document.getElementById("scribe-foot");
    if (!box || !foot) return;
    foot.style.marginTop = "0px";
    var slack = vp().h - (box.scrollHeight || 0);
    if (slack > 0) foot.style.marginTop = slack + "px";
  }

  /* ---------- 浮层（说明 / 详情） ---------- */

  function showFloat(title, inner) {
    floatOpen = title || "1";
    var el = document.getElementById("float");
    el.style.display = "block";
    el.innerHTML =
      '<div style="padding:' + px(14) + "px " + px(18) + "px " + px(16) + "px " + px(18) + 'px;">' +
      '<table width="100%" cellpadding="0" cellspacing="0" border="0"><tr>' +
      '<td><span style="' + F(28) + '"><b>' + esc(title) + "</b></span></td>" +
      '<td width="1%" align="right" nowrap="nowrap">' + tbtn("btn-float-close", "关闭") + "</td></tr></table>" +
      SP(10) + rule(px(3)) + SP(8) +
      inner + "</div>";
    document.getElementById("view-panels").style.display = "none";
    document.getElementById("view-full").style.display = "none";
    var close = document.getElementById("btn-float-close");
    if (close) close.onclick = hideFloat;
  }

  function hideFloat() {
    floatOpen = "";
    var el = document.getElementById("float");
    el.style.display = "none";
    el.innerHTML = "";
    applyMode();
  }

  function helpText() {
    if (currentView === "local") {
      return "本机显示各机官方限额和近 1 小时会话，不是中转面板里的账号。<br><br>限额条来自本机已登录的 Claude / Codex / Cursor / Grok / Kimi。<br><br>wait 第一刀仅 Claude AskUserQuestion + Codex request_user_input。Cursor / Grok / Kimi / GLM 暂无直接等人信号。";
    }
    if (currentScope === "user") {
      return "「我的」是当前登录用户的花费和 Key，不是上游账号的 5h / 7d。<br><br>今日 $0 表示今天还没有产生计费。点「详情」可看近 7 日和当天请求。";
    }
    if (currentScope === "people") {
      return "「用户」是站内各人的花费。点「详情」看近 7 日和当天请求。<br><br>自己的 Key 和分平台在「我的」里看，这里不单独标出哪一个是你。";
    }
    return "「全站」是上游账号的 5h / 7d 配额窗口，和本机官方限额分开看。";
  }

  function showHelp() {
    showFloat("说明", card('<span style="' + F(16) + '">' + helpText() + "</span>"));
  }

  function showPerson(s) {
    var b = s.breakdown || {};
    var days = b.days || [];
    var ev = b.today || [];
    var html = "";
    var i, max = 0, pct, row;
    html += section("近 7 日", days.length + " 天");
    if (!days.length) {
      html += card('<span style="' + F(16) + '">这 7 天没有计费记录。</span>');
    } else {
      for (i = 0; i < days.length; i++) if (days[i].cost > max) max = days[i].cost;
      var rows = '<table width="100%" cellpadding="' + px(3) + '" cellspacing="0" border="0">';
      for (i = 0; i < days.length; i++) {
        row = days[i];
        pct = max > 0 ? Math.round((row.cost / max) * 100) : 0;
        rows += "<tr>" +
          '<td width="16%"><span style="' + F(16) + '"><b>' + esc(shortDate(row.date)) + "</b></span></td>" +
          '<td width="50%">' + bar(pct, true) + "</td>" +
          '<td width="16%" align="right" nowrap="nowrap"><span style="' + F(15) + '"><b>' + moneyText(row.cost) + "</b></span></td>" +
          '<td width="14%" align="right" nowrap="nowrap"><span style="' + F(13) + '">' + esc(row.requests || 0) + " 次</span></td>" +
          "</tr>";
      }
      html += card(rows + "</table>");
    }
    var count = b.todayCount != null ? b.todayCount : ev.length;
    html += section("当天", count + " 次" + (ev.length ? " · " + ev.length + " 个模型" : ""));
    if (!ev.length) {
      html += card('<span style="' + F(16) + '">今天还没有计费请求。</span>');
    } else {
      var evCards = [];
      for (i = 0; i < ev.length; i++) {
        row = ev[i];
        evCards.push(card(
          '<span style="' + F(18) + '"><b>' + esc(shortTime(row.at)) + " · " + esc(row.model) + "</b></span><br>" + SP(4) +
          '<span style="' + F(14) + '">' +
          (row.count && row.count > 1 ? esc(row.count) + " 次 · " : "") +
          moneyText(row.cost) + (row.via ? " · " + esc(row.via) : "") + "</span>"
        ));
      }
      var cols = cardCols();
      if (cols < 2) {
        html += evCards.join("");
      } else {
        html += '<table width="100%" cellpadding="0" cellspacing="' + px(6) + '" border="0">';
        for (i = 0; i < evCards.length; i += cols) {
          html += '<tr><td width="' + Math.floor(100 / cols) + '%" valign="top">' + evCards[i] + "</td>";
          for (var c = 1; c < cols; c++) {
            html += '<td width="' + Math.floor(100 / cols) + '%" valign="top">' +
              (evCards[i + c] || "&nbsp;") + "</td>";
          }
          html += "</tr>";
        }
        html += "</table>";
      }
    }
    showFloat(s.tool || "用户", html);
  }

  /* ---------- 模式 / 绑定 ---------- */

  function applyMode() {
    var panels = wantPanels();
    if (floatOpen) {
      document.getElementById("view-panels").style.display = "none";
      document.getElementById("view-full").style.display = "none";
      document.getElementById("float").style.display = "block";
      return;
    }
    document.getElementById("float").style.display = "none";
    document.getElementById("view-panels").style.display = panels ? "block" : "none";
    document.getElementById("view-full").style.display = panels ? "none" : "block";
  }

  function setView(view, scope) {
    if (floatOpen) {
      floatOpen = "";
      document.getElementById("float").style.display = "none";
      document.getElementById("float").innerHTML = "";
    }
    currentView = view;
    if (scope) currentScope = scope;
    ensureScope();
    hashWrite();
    renderAll();
  }

  function bind() {
    var el, i;
    el = document.getElementById("btn-mode");
    if (el) el.onclick = function () {
      forced = wantPanels() ? "full" : "panels";
      hashWrite();
      renderAll();
    };
    el = document.getElementById("btn-refresh");
    if (el) el.onclick = function () { window.location.reload(); };
    el = document.getElementById("btn-help");
    if (el) el.onclick = showHelp;
    for (i = 0; i < DETAIL.length; i++) {
      el = document.getElementById("btn-detail-" + i);
      if (el) {
        el.onclick = (function (s) {
          return function () { showPerson(s); };
        })(DETAIL[i]);
      }
    }
    el = document.getElementById("btn-view-local");
    if (el) el.onclick = function () { setView("local"); };
    el = document.getElementById("btn-view-relay");
    if (el) el.onclick = function () { setView("relay"); };
    el = document.getElementById("ink-local");
    if (el) el.onclick = function () { setView("local"); };
    el = document.getElementById("ink-relay");
    if (el) el.onclick = function () { setView("relay"); };
    el = document.getElementById("ink-admin");
    if (el) el.onclick = function () { setView("relay", "admin"); };
    el = document.getElementById("ink-user");
    if (el) el.onclick = function () { setView("relay", "user"); };
    el = document.getElementById("ink-people");
    if (el) el.onclick = function () { setView("relay", "people"); };
    el = document.getElementById("ink-clock");
    if (el) el.onclick = function () { window.location.reload(); };
    el = document.getElementById("ink-help");
    if (el) el.onclick = showHelp;
  }

  function renderAll() {
    if (!MOCK) return;
    DETAIL = [];
    ensureScope();
    computeScale();
    renderTop();
    if (!isBigCanvas()) renderPocket();
    renderFull();
    applyMode();
    fitScribeCanvas();
    pinScribeFooter();
    pinPocketFooter();
    bind();
  }

  function loadLive(cb) {
    var url = "/view.json";
    var tok = qs("token");
    if (tok) url += (url.indexOf("?") >= 0 ? "&" : "?") + "token=" + encodeURIComponent(tok);
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          MOCK = JSON.parse(xhr.responseText);
          LIVE_UPDATED = MOCK.generatedAt || MOCK.time || "—";
          cb(null);
        } catch (e) {
          cb(e);
        }
        return;
      }
      cb(new Error("HTTP " + xhr.status));
    };
    xhr.send(null);
  }

  function boot() {
    if (!MOCK) {
      document.getElementById("topbar").innerHTML =
        '<table width="100%" cellpadding="12" cellspacing="0" border="1" bordercolor="' + INK + '"><tr><td>正在加载快照…</td></tr></table>';
      return;
    }
    var hash = hashRead();
    var qv = qs("view") || hash.view;
    if (qv === "relay" || qv === "sub2api") currentView = "relay";
    if (qv === "local") currentView = "local";
    var qscope = qs("scope") || hash.scope;
    if (qscope === "user" || qscope === "admin" || qscope === "people") currentScope = qscope;
    var qmode = qs("mode") || hash.mode;
    if (qmode === "panels" || qmode === "full") forced = qmode;
    ensureScope();

    renderAll();

    var timer = null;
    var re = function () {
      if (timer) clearTimeout(timer);
      timer = setTimeout(renderAll, 200);
    };
    window.onresize = re;
    if (window.addEventListener) {
      window.addEventListener("orientationchange", re, false);
    }

    document.onkeydown = function (e) {
      e = e || window.event;
      var k = e.keyCode || e.which;
      if (k === 27 && floatOpen) hideFloat();
    };

    refreshSec = parseInt(qs("refresh") || "0", 10);
    if (!refreshSec && isBigCanvas() && !window.AINDLE_MOCK) refreshSec = 60;
    if (refreshSec > 0) {
      setInterval(function () {
        if (window.AINDLE_MOCK) { renderAll(); return; }
        loadLive(function (err) {
          if (!err) renderAll();
        });
      }, refreshSec * 1000);
      renderTop();
    }
  }

  try {
    if (window.AINDLE_MOCK) {
      MOCK = window.AINDLE_MOCK;
      LIVE_UPDATED = MOCK.generatedAt || MOCK.time || "—";
      boot();
    } else {
      loadLive(function (err) {
        if (err) throw err;
        boot();
      });
    }
  } catch (e) {
    document.getElementById("topbar").innerHTML =
      '<table width="100%" cellpadding="12" cellspacing="0" border="1" bordercolor="#111111"><tr><td>' +
      "<b>初始化失败。</b><br>" + esc(e && e.message ? e.message : e) +
      "<br>当前浏览器可能过旧；请改用「主机出 PNG + FBInk」管线。</td></tr></table>";
  }
})();
</script>
</body>
</html>
